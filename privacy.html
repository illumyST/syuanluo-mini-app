<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隱私權政策｜玹璦的太極能量空間</title><link rel="stylesheet" href="./legal.css"></head><body><main><a href="./index.html">← 返回預約頁</a><h1>隱私權政策</h1><p>最後更新：2026 年 9 月 25 日</p><h2>蒐集資料</h2><p>為處理預約，我們可能蒐集姓名、電話、預約服務、日期時段與使用者主動提供的備註。若在 LINE MINI App 中使用個人檔案功能，也可能取得 LINE 顯示名稱。</p><h2>使用目的</h2><p>資料僅用於處理預約、聯繫、服務安排與必要的紀錄管理。</p><h2>保存與安全</h2><p>資料將以合理安全措施保存，並僅由處理服務所需的人員存取。</p><h2>聯絡與權利</h2><p>如欲查詢、更正或刪除個人資料，請透過本空間 LINE 官方帳號聯繫。</p></main></body></html>
