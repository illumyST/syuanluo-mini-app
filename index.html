<!doctype html>
<!-- 預約頁：HTML 定義欄位，styles.css 負責外觀，app.js 負責規則、驗證與送出。 -->
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3d3021" />
    <meta name="description" content="玹㼈的太極能量空間｜服務預約" />
    <title>玹㼈的太極能量空間｜服務預約</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <!-- 先載入 LINE SDK；defer 腳本等 HTML 解析後依序執行，先設定 API 網址，再操作表單。 -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="./config.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <!-- 純裝飾圖案以 aria-hidden 隱藏於輔助科技，避免干擾表單閱讀。 -->
      <div class="ink-cloud cloud-left" aria-hidden="true"></div>
      <div class="ink-cloud cloud-right" aria-hidden="true"></div>
      <header class="hero">
        <p class="eyebrow">SYUANLUO · TAIJI ENERGY SPACE</p>
        <div class="seal" aria-hidden="true">太極</div>
        <h1>玹㼈的太極能量空間</h1>
        <p class="hero-copy">順勢而行，安住當下。<br />在合適的時刻，為自己留一段靜心的空間。</p>
        <div class="yin-yang" aria-hidden="true"><span></span><i></i></div>
      </header>

      <section class="booking-card" aria-labelledby="booking-title">
        <div class="card-heading">
          <p class="step-mark">預約服務</p>
          <h2 id="booking-title">選一段為自己而留的時間</h2>
          <p>送出後將由我們確認預約細節。</p>
        </div>

        <!-- novalidate 關閉原生送出阻擋，由 app.js 讀取 validity 並顯示自訂錯誤；required 仍保留。 -->
        <form id="booking-form" novalidate>
          <!-- 相同 name 的 radio 只能選一個；value 是 API 服務代碼，label 讓整張卡片可以點選。 -->
          <fieldset class="service-fieldset">
            <legend>1．選擇服務 <span aria-hidden="true">*</span></legend>
            <div class="service-options">
              <input
                class="visually-hidden"
                type="radio"
                id="service-transfer"
                name="service"
                value="transfer"
                required
              />
              <label class="service-option" for="service-transfer">
                <span class="element-mark element-water">水</span>
                <span class="service-info"
                  ><strong>超渡</strong><small>每年 1、4、7、10 月第一個週日下午</small></span
                >
                <span class="service-price">不收費</span>
              </label>
              <input
                class="visually-hidden"
                type="radio"
                id="service-numerology"
                name="service"
                value="numerology"
                required
              />
              <label class="service-option" for="service-numerology">
                <span class="element-mark element-gold">金</span>
                <span class="service-info"
                  ><strong>生命靈數分析</strong><small>平日晚上、假日白天皆可預約</small></span
                >
                <span class="service-price">NT$ 3,000</span>
              </label>
            </div>
            <p class="field-error" id="service-error" aria-live="polite"></p>
          </fieldset>

          <!-- 日期與時段連動：app.js 設定日期下限，再依服務及日期產生時段選項。 -->
          <div class="form-grid">
            <div class="form-group">
              <label for="booking-date">2．選擇日期 <span aria-hidden="true">*</span></label>
              <input
                type="date"
                id="booking-date"
                name="date"
                required
                aria-describedby="date-hint date-error"
              />
              <p class="hint" id="date-hint">請先選擇服務，再選擇日期。</p>
              <p class="field-error" id="date-error" aria-live="polite"></p>
            </div>
            <div class="form-group">
              <label for="booking-time">3．可預約時段 <span aria-hidden="true">*</span></label>
              <!-- 時段初始停用，直到選好服務及有效日期才由 app.js 開放。 -->
              <select
                id="booking-time"
                name="time"
                required
                disabled
                aria-describedby="time-hint time-error"
              >
                <option value="">請先選擇服務與日期</option>
              </select>
              <p class="hint" id="time-hint">時段將在收到預約申請後再次確認。</p>
              <p class="field-error" id="time-error" aria-live="polite"></p>
            </div>
          </div>

          <!-- name 決定 FormData 送出的鍵，id 供 JavaScript 與 label 定位；aria-describedby 連結提示。 -->
          <fieldset class="contact-fieldset">
            <legend>4．留下聯絡資料</legend>
            <div class="form-grid">
              <div class="form-group">
                <label for="customer-name">姓名 <span aria-hidden="true">*</span></label>
                <input
                  id="customer-name"
                  name="name"
                  type="text"
                  required
                  maxlength="60"
                  autocomplete="name"
                  enterkeyhint="next"
                  aria-describedby="name-error"
                />
                <p class="field-error" id="name-error" aria-live="polite"></p>
              </div>
              <div class="form-group">
                <label for="customer-phone">手機號碼 <span aria-hidden="true">*</span></label>
                <input
                  id="customer-phone"
                  name="phone"
                  type="tel"
                  required
                  inputmode="tel"
                  maxlength="30"
                  autocomplete="tel"
                  enterkeyhint="next"
                  aria-describedby="phone-error"
                />
                <p class="field-error" id="phone-error" aria-live="polite"></p>
              </div>
            </div>
            <div class="form-group">
              <label for="customer-note">想告訴我們的事 <span class="optional">選填</span></label>
              <textarea
                id="customer-note"
                name="note"
                rows="4"
                maxlength="500"
                placeholder="例如：希望聯繫的時間、想了解的方向"
              ></textarea>
            </div>
          </fieldset>

          <!-- 同意框沒有指定 value，勾選後 FormData 會送 privacy=on，後端據此檢查同意狀態。 -->
          <label class="consent">
            <input
              type="checkbox"
              id="privacy-consent"
              name="privacy"
              required
              aria-describedby="privacy-error"
            />
            <span
              >我已閱讀並同意<a href="./privacy.html" target="_blank">隱私權政策</a>與<a
                href="./terms.html"
                target="_blank"
                >服務條款</a
              >。<b aria-hidden="true">*</b></span
            >
          </label>
          <p class="field-error" id="privacy-error" aria-live="polite"></p>

          <button class="submit-button" type="submit">
            送出預約申請 <span aria-hidden="true">→</span>
          </button>
          <!-- app.js 在此顯示送出結果；aria-live 讓輔助科技在文字更新時宣告訊息。 -->
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <footer>
        <p>太極之眼 · 順勢而行</p>
        <p class="footer-links">
          <a href="./terms.html">服務條款</a><span>·</span><a href="./privacy.html">隱私權政策</a>
        </p>
      </footer>
    </main>
  </body>
</html>
