# Cloudflare Worker 部署設定：名稱識別服務，main 指向 API 入口。
name = "syuanluo-booking-api"
main = "src/index.js"
# 以此日期選用 Workers 執行環境的相容行為，並非預約日期。
compatibility_date = "2026-09-27"

# 將既有 D1 資料庫綁定為 DB，程式便可透過 env.DB 執行 SQL。
[[d1_databases]]
binding = "DB"
database_name = "syuanluo-booking"
database_id = "5e70ec3e-a388-4b3d-97a1-16fbb1fa30d2"

# 一般環境變數；LINE 憑證等敏感值另外透過 Cloudflare secrets 設定。
[vars]
# 可用逗號分隔多個來源；只含協定與主機（必要時含埠），不含路徑或結尾斜線。
ALLOWED_ORIGINS = "https://illumyst.github.io"
